name: deterministic-checks

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BEADS_VERSION: 1.3.1
      BEADS_LINUX_AMD64_SHA256: 3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c
    steps:
      - uses: actions/checkout@v7
      - name: Verify published vendor pins (network)
        run: scripts/check-vendor-pins.sh
      - run: git submodule update --init --recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.13'
      - name: Install Beads
        run: |
          curl -fsSLo /tmp/beads.tar.gz "https://github.com/gastownhall/beads/releases/download/v${BEADS_VERSION}/beads_${BEADS_VERSION}_linux_amd64.tar.gz"
          echo "${BEADS_LINUX_AMD64_SHA256}  /tmp/beads.tar.gz" | sha256sum -c -
          tar -xzf /tmp/beads.tar.gz -C /tmp bd
          sudo install /tmp/bd /usr/local/bin/bd
      - name: Verify Beads Pi lifecycle compatibility surface
        run: |
          test "$(bd version | awk '{print $3}')" = "${BEADS_VERSION}"
          bd comments --help >/dev/null
          bd provenance --help >/dev/null
      - run: uv run --with pytest --with ruff python -m ruff check pi/agent/bin/agnt_lib tests
      - run: uv run --with pytest python -m pytest tests/
      - run: bash -n scripts/*.sh
      - run: scripts/check-pi-config.sh
      - run: pi/agent/bin/agnt eval run routing-smoke
      - run: pi/agent/bin/agnt eval run role-context-smoke
