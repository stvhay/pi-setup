name: deterministic-checks

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BEADS_VERSION: 1.1.0
      BEADS_LINUX_AMD64_SHA256: b0f3dd607c3fb989ee08d0a6854fba80d0402971eb108f9af6170bc14d491a34
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.13'
      - name: Install Beads
        run: |
          curl -fsSLo /tmp/beads.tar.gz "https://github.com/gastownhall/beads/releases/download/v${BEADS_VERSION}/beads_${BEADS_VERSION}_linux_amd64.tar.gz"
          echo "${BEADS_LINUX_AMD64_SHA256}  /tmp/beads.tar.gz" | sha256sum -c -
          tar -xzf /tmp/beads.tar.gz -C /tmp bd
          sudo install /tmp/bd /usr/local/bin/bd
      - run: uv run --with pytest --with ruff python -m ruff check pi/agent/bin/agnt_lib tests
      - run: uv run --with pytest python -m pytest tests/
      - run: bash -n scripts/*.sh
      - run: scripts/check-pi-config.sh
      - run: pi/agent/bin/agnt eval run routing-smoke
      - run: pi/agent/bin/agnt eval run role-context-smoke
